services:
  - type: web
    name: distribuidora-painel
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: CRM_ACCESS_TOKEN
        sync: false
      - key: CRM_SECRET_ACCESS_TOKEN
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
      # robô do delivery (Anota AI) — valores setados direto no painel do Render
      - key: ANOTA_CLIENT_ID
        sync: false
      - key: ANOTA_CLIENT_SECRET
        sync: false
      - key: ANOTA_PAGE_ID
        sync: false
