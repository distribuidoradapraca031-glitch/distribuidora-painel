<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — Distribuidora da Praça</title>
<style>
:root{--bg:#F4F2ED;--surface:#FFF;--ink:#26241F;--muted:#6E6A60;--line:#DDD8CC;--accent:#A66A12}
@media(prefers-color-scheme:dark){:root{--bg:#16181D;--surface:#1E2128;--ink:#E8E6E1;--muted:#9A9DA6;--line:#333845;--accent:#E0A33E}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);
  font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;padding:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 26px;width:100%;max-width:360px;box-shadow:0 8px 30px rgba(0,0,0,.10)}
h1{font-size:1.15rem;margin:0 0 4px}
p.sub{color:var(--muted);font-size:.85rem;margin:0 0 18px}
label{display:block;font-size:.75rem;color:var(--muted);margin-bottom:6px}
input{width:100%;font:inherit;font-size:1rem;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input:focus{outline:2px solid var(--accent);border-color:var(--accent)}
button{width:100%;margin-top:16px;font:inherit;font-size:.95rem;font-weight:700;border:0;background:var(--accent);color:#fff;padding:12px;border-radius:10px;cursor:pointer}
.err{background:#F8E3E1;color:#B3403A;border-radius:8px;padding:8px 12px;font-size:.82rem;margin-bottom:14px}
@media(prefers-color-scheme:dark){.err{background:#3A2220;color:#E5716A}}
</style>
</head>
<body>
  <form class="card" method="post" autocomplete="off">
    <h1>🍺 Distribuidora da Praça</h1>
    <p class="sub">Painel protegido — digite a senha pra entrar.</p>
    {% if err %}<div class="err">{{ err }}</div>{% endif %}
    <label for="senha">Senha</label>
    <input id="senha" name="senha" type="password" autofocus required>
    <button type="submit">Entrar</button>
  </form>
</body>
</html>
